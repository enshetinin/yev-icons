<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yev-icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2EFE8;
    --ink: #11100E;
    --signal: #FF4D1F;
    --bg: var(--paper);
    --fg: var(--ink);
    --muted: #5C5850;
    --line: #D6D1C6;
    --hover: #E7E3DA;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11100E;
      --fg: #F2EFE8;
      --muted: #A39E94;
      --line: #34312C;
      --hover: #1D1B18;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11100E;
    --fg: #F2EFE8;
    --muted: #A39E94;
    --line: #34312C;
    --hover: #1D1B18;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 1rem/1.5 "Atkinson Hyperlegible Next", system-ui, sans-serif;
  }
  code { font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; font-size: .875rem; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
    gap: 4rem;
    padding: 3rem 3rem 4rem 3rem;
    max-width: 90rem;
  }
  aside { position: sticky; top: 3rem; align-self: start; }

  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0; }
  .meta { color: var(--muted); margin: .25rem 0 2.5rem; }

  label, .label { display: block; font-weight: 700; font-size: .875rem; margin-bottom: .375rem; }
  input[type="search"] {
    width: 100%;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 0;
    padding: .5rem .625rem;
  }
  .field { margin-bottom: 1.5rem; }
  .sizes { display: flex; gap: .25rem; }
  .sizes button { min-width: 2.75rem; }

  button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: .375rem .625rem;
    cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .detail { margin-top: 3rem; }
  .detail-icon { display: block; width: 6rem; height: 6rem; margin-bottom: 1rem; }
  .detail h2 { font-size: 1.125rem; margin: 0; }
  .detail p { margin: 0 0 1rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: .25rem; }
  .status { min-height: 1.5rem; margin-top: .5rem; font-size: .875rem; color: var(--muted); }

  .theme { margin-top: 3rem; }

  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
    gap: .25rem;
  }
  .tile {
    width: 100%;
    display: grid;
    justify-items: center;
    gap: .75rem;
    padding: 1.5rem .5rem 1rem;
    border-color: transparent;
    position: relative;
  }
  .tile span { font-size: .8125rem; color: var(--muted); overflow-wrap: anywhere; }
  .tile[aria-pressed="true"] { background: transparent; color: inherit; border-color: var(--fg); }
  .tile[aria-pressed="true"] span { color: var(--fg); }
  .tile[aria-pressed="true"]::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: .5rem; height: .5rem;
    background: var(--signal);
  }
  .empty { color: var(--muted); }

  @media (max-width: 48rem) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 2rem; padding: 2rem 1rem; }
    aside { position: static; }
    .detail, .theme { margin-top: 2rem; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>yev-icons</h1>
    <p class="meta"><span id="count"></span> icons · 24 grid · 1.5 stroke</p>

    <div class="field">
      <label for="search">Search</label>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
    </div>

    <div class="field" role="group" aria-labelledby="size-label">
      <span class="label" id="size-label">Preview size</span>
      <div class="sizes" id="sizes"></div>
    </div>

    <section class="detail" id="detail" aria-labelledby="detail-name" hidden>
      <svg class="detail-icon" id="detail-icon" aria-hidden="true"></svg>
      <h2 id="detail-name"></h2>
      <p><code id="detail-component"></code></p>
      <div class="actions">
        <button type="button" data-copy="svg">Copy SVG</button>
        <button type="button" data-copy="jsx">Copy JSX</button>
        <button type="button" data-copy="import">Copy import</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <div class="theme">
      <button type="button" id="theme">Switch theme</button>
    </div>
  </aside>

  <main>
    <h2 class="visually-hidden">Icons</h2>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No icons match.</p>
  </main>
</div>

<script>
  const ATTRS = {"viewBox":"0 0 24 24","fill":"none","stroke":"currentColor","stroke-width":"1.5","stroke-linecap":"square","stroke-linejoin":"miter"};
  const ICONS = [{"name":"arrow-down","component":"ArrowDownIcon","inner":"<path d=\"M12 4v16m-6-6 6 6 6-6\"/>"},{"name":"arrow-left","component":"ArrowLeftIcon","inner":"<path d=\"M20 12H4m6-6-6 6 6 6\"/>"},{"name":"arrow-right","component":"ArrowRightIcon","inner":"<path d=\"M4 12h16m-6-6 6 6-6 6\"/>"},{"name":"arrow-up-right","component":"ArrowUpRightIcon","inner":"<path d=\"M6 18 18 6M8 6h10v10\"/>"},{"name":"arrow-up","component":"ArrowUpIcon","inner":"<path d=\"M12 20V4m-6 6 6-6 6 6\"/>"},{"name":"article","component":"ArticleIcon","inner":"<path d=\"M5 3h10l4 4v14H5zm10 0v4h4M8 11h8m-8 3h8m-8 3h5\"/>"},{"name":"branch","component":"BranchIcon","inner":"<path d=\"M4 6a2 2 0 1 0 4 0 2 2 0 1 0-4 0Zm0 12a2 2 0 1 0 4 0 2 2 0 1 0-4 0ZM16 6a2 2 0 1 0 4 0 2 2 0 1 0-4 0ZM6 8v8m12-8v2a3 3 0 0 1-3 3H9a3 3 0 0 0-3 3\"/>"},{"name":"check","component":"CheckIcon","inner":"<path d=\"m4 12 5 5L20 6\"/>"},{"name":"chevron-right","component":"ChevronRightIcon","inner":"<path d=\"m9 5 7 7-7 7\"/>"},{"name":"close","component":"CloseIcon","inner":"<path d=\"m6 6 12 12m0-12L6 18\"/>"},{"name":"code","component":"CodeIcon","inner":"<path d=\"m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16\"/>"},{"name":"copy","component":"CopyIcon","inner":"<path d=\"M8 8h12v12H8zm8 0V4H4v12h4\"/>"},{"name":"download","component":"DownloadIcon","inner":"<path d=\"M12 4v11m-5-5 5 5 5-5M4 20h16\"/>"},{"name":"edit","component":"EditIcon","inner":"<path d=\"M4 20v-4L15 5l4 4L8 20zm8-12 4 4\"/>"},{"name":"external-link","component":"ExternalLinkIcon","inner":"<path d=\"M19 13v7H4V5h7m3-1h6v6m0-6-9 9\"/>"},{"name":"info","component":"InfoIcon","inner":"<path d=\"M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0Zm9-1v6m0-9.5h.01\"/>"},{"name":"link","component":"LinkIcon","inner":"<path d=\"M9 8H7a4 4 0 0 0 0 8h2m6-8h2a4 4 0 0 1 0 8h-2m-7-4h8\"/>"},{"name":"menu","component":"MenuIcon","inner":"<path d=\"M4 6h16M4 12h16M4 18h16\"/>"},{"name":"plus","component":"PlusIcon","inner":"<path d=\"M12 5v14m-7-7h14\"/>"},{"name":"post","component":"PostIcon","inner":"<path d=\"M4 3h16v18H4zm3 3h10v6H7zm0 9h10M7 18h6\"/>"},{"name":"search","component":"SearchIcon","inner":"<path d=\"M4 11a7 7 0 1 0 14 0 7 7 0 1 0-14 0Zm12 5 5 5\"/>"},{"name":"settings","component":"SettingsIcon","inner":"<path d=\"M4 7h10m4 0h2M4 17h2m4 0h10M14 7a2 2 0 1 0 4 0 2 2 0 1 0-4 0ZM6 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0Z\"/>"},{"name":"tag","component":"TagIcon","inner":"<path d=\"M3 3h8l10 10-8 8L3 11zm4.5 4.5h.01\"/>"},{"name":"user","component":"UserIcon","inner":"<path d=\"M8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0ZM4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2\"/>"}];
  const SIZES = [16, 20, 24, 32];

  const $ = (id) => document.getElementById(id);
  const svgAttrs = Object.entries(ATTRS).map(([k, v]) => `${k}="${v}"`).join(' ');
  const svgSource = (icon) =>
    `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" ${svgAttrs}>${icon.inner}</svg>`;
  const applyAttrs = (svg, icon) => {
    for (const [k, v] of Object.entries(ATTRS)) svg.setAttribute(k, v);
    svg.innerHTML = icon.inner;
  };

  let size = 24;
  let selected = null;

  $('count').textContent = ICONS.length;

  const tiles = ICONS.map((icon) => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tile';
    button.setAttribute('aria-pressed', 'false');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('aria-hidden', 'true');
    applyAttrs(svg, icon);
    const label = document.createElement('span');
    label.textContent = icon.name;
    button.append(svg, label);
    button.addEventListener('click', () => select(icon));
    li.append(button);
    $('grid').append(li);
    return { icon, li, button, svg };
  });

  for (const s of SIZES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.setAttribute('aria-pressed', String(s === size));
    b.addEventListener('click', () => {
      size = s;
      for (const other of $('sizes').children) other.setAttribute('aria-pressed', String(other === b));
      renderSize();
    });
    $('sizes').append(b);
  }

  function renderSize() {
    for (const t of tiles) {
      t.svg.setAttribute('width', size);
      t.svg.setAttribute('height', size);
    }
  }

  function select(icon) {
    selected = icon;
    for (const t of tiles) t.button.setAttribute('aria-pressed', String(t.icon === icon));
    applyAttrs($('detail-icon'), icon);
    $('detail-name').textContent = icon.name;
    $('detail-component').textContent = `<${icon.component} />`;
    $('status').textContent = '';
    $('detail').hidden = false;
  }

  const snippets = {
    svg: (icon) => svgSource(icon),
    jsx: (icon) => `<${icon.component} />`,
    import: (icon) => `import { ${icon.component} } from 'yev-icons';`,
  };
  for (const b of document.querySelectorAll('[data-copy]')) {
    b.addEventListener('click', async () => {
      if (!selected) return;
      try {
        await navigator.clipboard.writeText(snippets[b.dataset.copy](selected));
        $('status').textContent = `Copied ${b.textContent.replace('Copy ', '')} for ${selected.name}`;
      } catch {
        $('status').textContent = 'Clipboard not available in this browser';
      }
    });
  }

  $('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    let visible = 0;
    for (const t of tiles) {
      const match = !q || t.icon.name.includes(q) || t.icon.component.toLowerCase().includes(q);
      t.li.hidden = !match;
      if (match) visible++;
    }
    $('empty').hidden = visible > 0;
  });

  const root = document.documentElement;
  try {
    const saved = localStorage.getItem('yev-icons-theme');
    if (saved) root.dataset.theme = saved;
  } catch {}
  $('theme').addEventListener('click', () => {
    const current = root.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = current === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('yev-icons-theme', root.dataset.theme); } catch {}
  });

  renderSize();
</script>
</body>
</html>
